name: VibeNest Database Migrations

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration files exist
        run: |
          if [ ! -d "supabase/migrations" ]; then
            echo "No migration directory found."
            exit 1
          fi
          echo "Migration directory exists."
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print
